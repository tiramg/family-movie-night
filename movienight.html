<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Movie Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:'Inter',-apple-system,system-ui,sans-serif; color:#ffffff;
    background: linear-gradient(180deg,#13131a 0%,#0b0b0f 220px,#0b0b0f 100%); min-height:100vh; }
  .wrap { max-width:640px; margin:0 auto; padding:28px 18px 60px; }
  header { text-align:center; padding:18px 0 8px; }
  .marquee { display:inline-block; font-size:11px; font-weight:800; letter-spacing:2.5px; color:#ffffff;
    background:#e50914; padding:7px 14px; border-radius:999px; }
  h1 { font-family:'Inter',sans-serif; font-weight:900; font-size:44px; letter-spacing:-1.2px; line-height:1.02; margin:14px 0 8px; color:#ffffff; }
  .sub { color:#a3a3ad; font-size:16px; margin:0; }
  .sub b { color:#ffffff; }
  .addbar { display:flex; gap:10px; margin:26px 0 8px; }
  .addbar input { flex:1; min-width:0; padding:16px 18px; font-size:17px; border-radius:12px; border:1px solid #ffffff1a;
    background:#1d1d24; color:#ffffff; outline:none; }
  .addbar input::placeholder { color:#71717d; }
  .addbar input:focus { border-color:#e50914; background:#23232c; }
  .btn { border:0; cursor:pointer; font-weight:800; border-radius:12px; font-family:inherit; }
  .addbtn { padding:16px 20px; font-size:16px; background:#e50914; color:#ffffff; border-radius:12px; }
  .addbtn:active { transform:scale(.97); }
  .hint { text-align:center; color:#71717d; font-size:13px; margin:6px 0 20px; line-height:1.5; }
  .card { background:#17171e; border:1px solid #ffffff12; border-radius:16px; padding:16px 16px 12px; margin:12px 0; }
  .titlerow { display:flex; align-items:flex-start; gap:12px; }
  .poster { width:46px; height:68px; border-radius:6px; object-fit:cover; flex:none; background:#23232c; box-shadow:0 4px 12px #00000055; }
  a.linkbtn { text-decoration:none; display:inline-block; }
  .trailer { color:#ff4d57 !important; }
  .rank { font-family:'Inter',sans-serif; font-size:18px; font-weight:800; color:#71717d; width:26px; text-align:center; flex:none; padding-top:3px; }
  .title { flex:1; min-width:0; font-size:22px; font-weight:700; line-height:1.3; color:#ffffff;
    overflow-wrap:break-word; word-break:normal; }
  .top .title { font-size:24px; }
  .top { border-color:#e5091459; border-left:4px solid #e50914; background:#1b1b23; }
  .crown { font-size:13px; color:#ff4d57; font-weight:800; letter-spacing:1px; white-space:nowrap; }
  .ctrlrow { display:flex; align-items:center; gap:14px; margin-top:12px; }
  .votes { display:flex; align-items:baseline; gap:6px; }
  .vnum { font-family:'Inter',sans-serif; font-size:26px; font-weight:900; line-height:1; color:#ffffff; }
  .vlab { font-size:11px; color:#71717d; letter-spacing:1px; }
  .votebtn { margin-left:auto; flex:none; padding:12px 22px; font-size:16px; background:#ffffff; color:#000000; border-radius:999px; }
  .votebtn:active { transform:scale(.95); }
  .votebtn.voted { background:#2e7d5b; color:#ffffff; }
  .votebtn[disabled] { opacity:.55; }
  .smallbtns { margin-top:10px; border-top:1px solid #ffffff0f; padding-top:8px; display:flex; gap:18px; }
  .linkbtn { background:none; border:0; color:#8e8e99; font-size:13px; font-weight:600; cursor:pointer; padding:4px 0; text-align:left; font-family:inherit; }
  .linkbtn:active { color:#ffffff; }
  .watchedsec { margin-top:34px; }
  .watchedsec h2 { font-size:14px; letter-spacing:2px; color:#71717d; text-transform:uppercase; }
  .wcard { opacity:.55; }
  .wcard .title { text-decoration:line-through; }
  .empty { text-align:center; color:#71717d; padding:36px 10px; font-size:17px; line-height:1.5; }
  .loading { text-align:center; color:#71717d; padding:30px; }
  footer { text-align:center; color:#62626d; font-size:13px; margin-top:40px; line-height:1.6; }
  @media (max-width:420px){ h1{font-size:37px} .title{font-size:20px} .top .title{font-size:22px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="marquee">EVERY SUNDAY</div>
    <h1>Family Movie Night</h1>
    <p class="sub">Sundays at <b>7 PM</b> · Downstairs, big screen</p>
  </header>

  <div class="addbar">
    <input id="newTitle" type="text" placeholder="Add a movie title…" maxlength="120"
      onkeydown="if(event.key==='Enter')addMovie()">
    <button class="btn addbtn" onclick="addMovie()">Add</button>
  </div>
  <p class="hint">Tap <b>Vote</b> on the movies you want to watch — one vote per movie. Tap <b>✓ Voted</b> again to take your vote back. Most votes goes to the top.</p>

  <div id="list"><div class="loading">Loading movies…</div></div>
  <div id="watched"></div>

  <footer>Be there if you can — and if you can't,<br>we'll do it again next Sunday. 🍿</footer>
</div>

<script>
  var movies = [];
  // One vote per movie per person: this device remembers which titles it has
  // voted for (keyed by title, so it survives list reordering). Tapping a
  // voted movie again takes the vote back.
  function norm(t){ return String(t || '').trim().toLowerCase(); }
  function getVoted(){ try { return JSON.parse(localStorage.getItem('fmn_voted_r3') || '[]'); } catch(e){ return []; } }
  function setVoted(a){ try { localStorage.setItem('fmn_voted_r3', JSON.stringify(a)); } catch(e){} }
  function hasVoted(t){ return getVoted().indexOf(norm(t)) >= 0; }
  function markVoted(t){ var a = getVoted(); if (a.indexOf(norm(t)) < 0) { a.push(norm(t)); setVoted(a); } }
  function unmarkVoted(t){ setVoted(getVoted().filter(function(x){ return x !== norm(t); })); }
  function esc(s){ return s.replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  // Display titles properly: capitalise each word (small words stay lower
  // unless first), and insert "The" for the titles that officially have it.
  var TITLE_FIX = {
    'shawshank redemption': 'The Shawshank Redemption',
    'matrix': 'The Matrix',
    'terminator': 'The Terminator',
    'ballad of the songbirds and snakes': 'The Ballad of the Songbirds and Snakes'
  };
  function displayTitle(t){
    var key = norm(t);
    if (TITLE_FIX[key]) return TITLE_FIX[key];
    var small = {a:1, an:1, the:1, and:1, or:1, of:1, at:1, in:1, on:1, to:1};
    return String(t || '').trim().split(/\s+/).map(function(w, i){
      var lw = w.toLowerCase();
      if (i > 0 && small[lw]) return lw;
      return lw.charAt(0).toUpperCase() + lw.slice(1);
    }).join(' ');
  }
  function render(data){
    movies = data || [];
    var active = movies.filter(function(m){return !m.watched;});
    var watched = movies.filter(function(m){return m.watched;});
    active.sort(function(a,b){ return b.votes - a.votes; });
    var h = '';
    if (!active.length) h = '<div class="empty">No movies yet.<br>Add the first title above! 🎬</div>';
    active.forEach(function(m, i){
      h += '<div class="card' + (i===0 && m.votes>0 ? ' top' : '') + '">'
        + '<div class="titlerow"><div class="rank">' + (i+1) + '</div>'
        + (m.poster ? '<img class="poster" src="' + esc(m.poster) + '" alt="" loading="lazy">' : '')
        + '<div class="title">' + esc(displayTitle(m.title)) + '</div></div>'
        + '<div class="ctrlrow"><div class="votes"><span class="vnum">' + m.votes + '</span><span class="vlab">VOTES</span></div>'
        + (i===0 && m.votes>0 ? '<div class="crown">★ TOP PICK</div>' : '')
        + (hasVoted(m.title)
            ? '<button class="btn votebtn voted" onclick="toggleVote(' + m.row + ',this)">✓ Voted</button></div>'
            : '<button class="btn votebtn" onclick="toggleVote(' + m.row + ',this)">Vote</button></div>')
        + '<div class="smallbtns">'
        + (m.trailer ? '<a class="linkbtn trailer" href="' + esc(m.trailer) + '" target="_blank" rel="noopener">▶ Trailer</a>' : '')
        + '<button class="linkbtn" onclick="askWatched(' + m.row + ',this)">✓ Watched it</button></div>'
        + '</div>';
    });
    document.getElementById('list').innerHTML = h;
    var w = '';
    if (watched.length){
      w = '<div class="watchedsec"><h2>Watched</h2>';
      watched.forEach(function(m){
        w += '<div class="card wcard"><div class="titlerow">'
          + (m.poster ? '<img class="poster" src="' + esc(m.poster) + '" alt="" loading="lazy">' : '')
          + '<div class="title">' + esc(displayTitle(m.title)) + '</div></div>'
          + '<div class="ctrlrow"><div class="votes"><span class="vnum">' + m.votes + '</span><span class="vlab">VOTES</span></div></div>'
          + '<div class="smallbtns"><button class="linkbtn" onclick="setWatched(' + m.row + ',false)">↩ Put it back</button>'
          + '<button class="linkbtn" onclick="del(' + m.row + ',this)">🗑 Delete</button></div></div>';
      });
      w += '</div>';
    }
    document.getElementById('watched').innerHTML = w;
  }
  var BASE = location.pathname.indexOf('/movienight') === 0 ? '/movienight/' : '/';
  function api(path, payload){ path = BASE + path;
    var opts = payload
      ? { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) }
      : {};
    fetch(path, opts)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.ok) render(d.movies);
        else { document.querySelector('.hint').textContent = 'Something went wrong — try again.'; load(); }
      })
      .catch(function(){ document.querySelector('.hint').textContent = 'Something went wrong — try again.'; load(); });
  }
  function load(){ api('api/movies'); }
  function addMovie(){
    var el = document.getElementById('newTitle');
    var t = displayTitle(el.value.trim()); if(!t) return;
    el.value='';
    markVoted(t); // adding a movie counts as your vote for it
    api('api/add', { title: t });
  }
  function toggleVote(row, btn){
    var m = null;
    for (var i = 0; i < movies.length; i++) if (movies[i].row === row) { m = movies[i]; break; }
    if (!m) return;
    if (btn) btn.disabled = true; // one request at a time — no double-tap doubles
    if (hasVoted(m.title)) { unmarkVoted(m.title); api('api/unvote', { row: row }); }
    else { markVoted(m.title); api('api/vote', { row: row }); }
  }
  function setWatched(row, w){ api('api/watched', { row: row, watched: w }); }
  function askWatched(row, btn){
    // Two-tap confirm: moving a movie off the list is deliberate, never one stray tap.
    if (btn && btn.dataset.armed) { setWatched(row, true); return; }
    if (btn) {
      btn.dataset.armed = '1';
      btn.textContent = 'We watched it Sunday? Tap again to move it off the list';
      btn.style.color = '#ff4d57';
      setTimeout(function(){ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent = '✓ Watched it'; btn.style.color = ''; } }, 6000);
    } else { setWatched(row, true); }
  }
  function del(row, btn){
    // Two-tap delete: first tap arms the button, second tap within 3 seconds deletes.
    if (btn && btn.dataset.armed) { api('api/delete', { row: row }); return; }
    if (btn) {
      btn.dataset.armed = '1';
      btn.textContent = '\u26a0 Tap again to delete';
      btn.style.color = '#ff4d57';
      setTimeout(function(){ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent = '🗑 Delete'; btn.style.color = ''; } }, 6000);
    } else { api('api/delete', { row: row }); }
  }
  load();
  setInterval(load, 20000);
</script>
</body>
</html>
